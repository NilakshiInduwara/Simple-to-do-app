version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DB_HOST=db 
      - DB_PORT=3306 
      - NODE_ENV=development
      - PORT=5000
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=todoapp_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: todo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todoapp_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    
    # ADDED HEALTHCHECK BLOCK
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=todoapp_db
    depends_on:
      db:
        condition: service_healthy
    command: npm test

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm test
    depends_on:
      - backend

volumes:
  db_data: